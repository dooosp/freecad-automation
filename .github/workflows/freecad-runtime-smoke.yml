name: FreeCAD Runtime Smoke (self-hosted macOS)

on:
  workflow_run:
    workflows: ["Automation CI (hosted fast lanes)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: freecad-runtime-smoke-${{ github.event.workflow_run.event || github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  macos-runtime-smoke:
    name: Self-hosted macOS FreeCAD smoke
    # Pull request smoke is sequenced behind successful hosted CI and is limited
    # to same-repository heads. Manual dispatch and the schedule are default-
    # branch runtime-owner checks.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'dooosp' && ((github.event.workflow_run.event == 'pull_request') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master'))) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master' && github.actor == 'dooosp') }}
    runs-on: [self-hosted, macOS, freecad, freecad-automation-runtime]
    environment: freecad-runtime-smoke
    timeout-minutes: 45
    steps:
      - name: Checkout
        # provenance: actions/checkout@v6 -> de0fac2e4500dabe0009e67214ff5f5447ce83dd
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        # provenance: actions/setup-node@v6 -> 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Clear previous runtime smoke temp outputs
        run: rm -rf .ci output/smoke .pytest_cache

      - name: CI Diagnostics
        run: |
          mkdir -p .ci
          bash .github/scripts/ci-diagnostics.sh | tee .ci/freecad-runtime-diagnostics.txt

      - name: Install Node Dependencies
        run: bash .github/scripts/retry.sh 3 15 npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Verify FreeCAD runtime
        run: node bin/fcad.js check-runtime

      - name: Capture runtime contract
        run: node bin/fcad.js check-runtime --json --redact-paths > .ci/freecad-runtime.json

      - name: Run CLI runtime smoke lane
        run: npm run test:runtime-smoke

      - name: Run runtime-backed Python smoke regressions
        run: node scripts/run-pytest.js -q tests/test_cli_runtime.py tests/test_infotainment_draw_qa_regression.py tests/test_infotainment_hole_dia_regression.py

      - name: Index runtime smoke outputs
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "# output/smoke"
            if [ -d output/smoke ]; then
              find output/smoke -maxdepth 3 -type f | sort
            else
              echo "output/smoke missing"
            fi
          } | tee .ci/freecad-runtime-artifacts.txt

      - name: Upload runtime diagnostics
        if: always()
        # provenance: actions/upload-artifact@v7 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freecad-runtime-smoke-diagnostics-${{ github.run_id }}
          path: |
            .ci/freecad-runtime-diagnostics.txt
            .ci/freecad-runtime.json
            .ci/freecad-runtime-artifacts.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime smoke outputs
        if: always()
        # provenance: actions/upload-artifact@v7 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freecad-runtime-smoke-artifacts-${{ github.run_id }}
          path: |
            output/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup runtime smoke temp outputs
        if: always()
        run: rm -rf .ci output/smoke .pytest_cache
