# Flat mounting plate: one horizontal box with cylinder cuts.
# Five required dimensions; no inferred web. Explicit user intents still merge.

[template]
part_type = "plate"
schema_version = "0.1"
description = "KS flat mounting plate drawing template"

# --- Views ---
[views]
enabled = ["front", "top", "right", "iso"]
layout = "third_angle"

[views.options]
front = { show_hidden = true, show_centerlines = true }
top   = { show_hidden = true, show_centerlines = true }
right = { show_hidden = true, show_centerlines = true }
iso   = { show_hidden = false, show_centerlines = false }

# --- Datums ---
[[datums]]
name = "A"
kind = "plane"
selector = "base_bottom_plane"
reason = "primary mounting face — base bottom"

[[datums]]
name = "B"
kind = "axis"
selector = "primary_hole_axis"
reason = "primary hole center axis"

# --- Dimensioning Style ---
[dimensioning]
scheme = "baseline"
baseline_datum = "A"
avoid_redundant = true
auto_plan_dedupe = "smart"
redundancy_tol_mm = 0.5
# Retain the previous bracket QA deductions; only requirement selection changes.
qa_weight_preset = "bracket"

# --- Flat plate dimensions ---
[[dim_intents]]
id = "WIDTH"
feature = "base_length"
view = "front"
style = "linear"
required = true
priority = 100
reason = "Base plate length — overall footprint"

[[dim_intents]]
id = "HEIGHT"
feature = "overall_height"
view = "front"
style = "linear"
required = true
priority = 95
placement = { side = "left" }
reason = "Plate height — installation clearance"

[[dim_intents]]
id = "THK"
feature = "base_thickness"
view = "right"
style = "linear"
required = true
priority = 90
placement = { side = "right" }
reason = "Base plate thickness — structural strength"

[[dim_intents]]
id = "HOLE_DIA"
feature = "mounting_hole_diameter"
view = "front"
style = "diameter"
required = true
priority = 80
placement = { side = "top_right", angle_deg = 30, offset_mm = 2 }
reason = "Mounting hole diameter — fastener selection"

[[dim_intents]]
id = "BASE_W"
feature = "base_width"
view = "top"
style = "linear"
required = true
priority = 75
reason = "Base plate width — mounting footprint"

[[dim_intents]]
id = "FILLET"
feature = "fillet_radius"
view = "right"
style = "radius"
required = false
priority = 40

[[dim_intents]]
id = "HOLE_SPACING"
feature = "hole_spacing"
view = "top"
style = "linear"
required = false
priority = 35

# --- Manufacturing defaults (for DFM + D4 strategy) ---
[manufacturing]
process = "machining"
material = "AL6061-T6"
batch_size = 1
min_wall_override = 0
process_sequence = ["face", "rough_mill", "drill", "deburr"]

# --- Notes ---
[notes]
general = [
  "UNLESS OTHERWISE SPECIFIED:",
  "  TOLERANCES PER KS B 0401 CLASS m",
  "  SURFACE FINISH Ra 6.3",
  "REMOVE ALL BURRS AND SHARP EDGES.",
]
placement = "bottom_left"
